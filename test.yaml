---
apiVersion: v1
kind: Secret
metadata:
  name: simple-admin-credentials
stringData:
  admin: admin
---
apiVersion: authentication.stackable.tech/v1alpha1
kind: AuthenticationClass
metadata:
  name: simple-nifi-users
spec:
  provider:
    static:
      userCredentialsSecret:
        name: simple-admin-credentials
---
apiVersion: nifi.stackable.tech/v1alpha1
kind: NifiCluster
metadata:
  name: simple-nifi
spec:
  image:
    productVersion: 2.6.0
  clusterConfig:
    authentication:
      - authenticationClass: simple-nifi-users
    sensitiveProperties:
      keySecret: nifi-sensitive-property-key
      autoGenerate: true
  nodes:
    roleConfig:
      listenerClass: external-unstable
    roleGroups:
      default:
        replicas: 0
    # When NiFi is exposed through a NodePort Service it's SNI check has to be disabled
    configOverrides:
      nifi.properties:
        nifi.web.https.sni.required: "false"
        nifi.web.https.sni.host.check: "false"
---
apiVersion: autoscaling.stackable.tech/v1alpha1
kind: StackableScaler
metadata:
  name: simple-nifi-nodes-default
  labels:
    stackable.tech/cluster-kind: NifiCluster
    app.kubernetes.io/name: nifi
    app.kubernetes.io/instance: simple-nifi
    app.kubernetes.io/component: node
    app.kubernetes.io/role-group: default
spec:
  replicas: 2
  clusterRef:
    kind: NifiCluster
    name: simple-nifi
  role: node
  roleGroup: default
